name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Baked into the Windows and Android builds. The release job below publishes
  # this file as the "latest" release asset, so in-app "Check for updates"
  # always reads the newest version.
  VITE_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/updates.json
  VITE_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL || 'admin@rhemanigeria.com' }}
  VITE_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RhemaClassTimer-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RhemaClassTimer-windows
          path: release/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          # upload-artifact stores files relative to their least common ancestor,
          # so a single uploaded file is placed directly under the artifact root.
          APK="$(find artifacts/RhemaClassTimer-android -name '*.apk' -type f | head -n 1)"
          EXE="$(find artifacts/RhemaClassTimer-windows -name 'RhemaClassTimer-Setup-*.exe' -type f | head -n 1)"
          test -n "$APK" && test -f "$APK"
          test -n "$EXE" && test -f "$EXE"
          cp "$APK" "release-files/RhemaClassTimer-${VERSION}.apk"
          cp "$EXE" "release-files/"
          cat > release-files/updates.json <<EOF
          {
            "version": "${VERSION}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Recording start/stop reminders, feedback and update checks.",
            "windows": { "url": "https://github.com/${REPO}/releases/latest/download/RhemaClassTimer-Setup-${VERSION}.exe" },
            "android": { "url": "https://github.com/${REPO}/releases/latest/download/RhemaClassTimer-${VERSION}.apk" },
            "web": { "url": "https://github.com/${REPO}/releases/latest" }
          }
          EOF
          cat release-files/updates.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Rhema Class Timer v${{ steps.meta.outputs.version }}
          body: |
            Recording start/stop reminders, feedback and update checks.

            - Red "START RECORDING NOW" warning at every session start
            - Amber "STOP RECORDING NOW" warning at every session end
            - Feedback form in the app
            - Check for updates in the app
          files: release-files/*
          fail_on_unmatched_files: true
